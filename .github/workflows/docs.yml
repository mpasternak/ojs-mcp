name: docs

# Publikacja dokumentacji na GitHub Pages przy każdym pushu na `main`,
# który dotyka dokumentacji albo jej konfiguracji. `workflow_dispatch`
# pozwala odpalić ręcznie (np. po zmianie ustawień Pages w repo).
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Tylko jedno wdrożenie na raz — kolejny push czeka, żadne nie jest
# przerywane w trakcie (`cancel-in-progress: false`), żeby nie zostawić
# strony w stanie pół-wdrożonym.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Zsynchronizuj zależności dokumentacji
        run: uv sync --extra docs

      # Tryb ścisły: zepsuty odnośnik albo plik spoza nav wywala build
      # tutaj, zanim trafi na opublikowaną stronę.
      - name: Zbuduj dokumentację (mkdocs build --strict)
        run: uv run mkdocs build --strict

      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Wgraj zbudowaną stronę jako artefakt Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Opublikuj na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
