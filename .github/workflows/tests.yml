name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable from `release.yml` — a release goes through the same matrix,
  # instead of keeping a copy of it.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff format --check
        run: uv run ruff format --check .

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest -q

  # `test` goes by uv.lock, so it only ever sees the versions frozen in the
  # repo. This job resolves dependencies from scratch — the way a resolver
  # would for someone installing from PyPI. It catches an API break in
  # `mcp`/`httpx` before it reaches a release.
  test-newest-deps:
    runs-on: ubuntu-latest
    # Informational: red here means "someone upstream released an
    # incompatible version", not "this PR is broken". Does not block merges.
    continue-on-error: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Resolve dependencies from scratch
        run: uv sync --extra dev --upgrade

      - name: Pytest
        run: uv run pytest -q
