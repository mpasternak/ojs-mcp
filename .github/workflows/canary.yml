name: canary

# A weekly test against dependencies resolved FROM SCRATCH — not the ones
# frozen in uv.lock. `tests.yml` checks only what's in the repo, and only
# on push/PR; `uv.lock` then gives reproducibility, but says nothing about
# what someone installing fresh from PyPI today would actually get.
#
# This workflow runs AFTER release (a schedule, not a push hook) — it is
# not a gate for any merge or publish, just a warning that a dependency
# released after our `uv.lock` (e.g. a new `mcp` or `httpx` version) broke
# the API this server relies on.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Resolve dependencies from scratch
        run: uv sync --extra dev --upgrade

      - name: Pytest
        run: uv run pytest -q
