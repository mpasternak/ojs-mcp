name: mcpb

# Builds the MCP Bundle (.mcpb) package — a "one-click" installer for a
# desktop MCP client — and attaches it to the GitHub release.
#
# Triggered by a tag push — same as release.yml, because here a tag is
# what makes a release, not a manually created Release object. When a
# release for the tag doesn't exist yet (e.g. release.yml hasn't finished
# yet), this workflow creates it.
#
# Deliberately a separate FILE from release.yml: that one holds
# `id-token: write` (OIDC to PyPI) in a separate job that runs nothing, and
# shouldn't get `contents: write` just to upload a file to a release. But
# NOT separate as a test gate: a bare tag push does not trigger `tests.yml`
# by itself (that one reacts to a push to main, a PR, and workflow_call),
# so without its own `tests` job this workflow would run independently of
# whether the test suite passed for this tag. The `tests` job below
# (workflow_call, same as in release.yml) takes care of that: a tag
# blocked from PyPI by red tests won't get a bundle either.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcpb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The same matrix (3.10-3.13 + ruff) as on a regular push, via
  # `workflow_call` — without copying it here. `bundle` waits on this job
  # (`needs: tests`), so the bundle won't reach a release unless the tests
  # are green for this tag.
  tests:
    uses: ./.github/workflows/tests.yml

  bundle:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write # uploading the .mcpb file to the release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      # manifest.json has its own `version` field, and a stale one would
      # ship a package claiming to be a different release. The source of
      # truth is pyproject.toml, so we reconcile them before packaging
      # instead of relying on a human to keep two files in sync. release.yml
      # already checks that the tag matches the version.
      - name: Reconcile the version in manifest.json with pyproject.toml
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          path = pathlib.Path("manifest.json")
          manifest = json.loads(path.read_text())

          if manifest["version"] != version:
              print(f"manifest.json: {manifest['version']} -> {version}")
              manifest["version"] = version
              path.write_text(json.dumps(manifest, indent=2) + "\n")
          else:
              print(f"manifest.json already at version {version}")

          with open("bundle.env", "w") as fh:
              fh.write(f"BUNDLE={manifest['name']}.mcpb\n")
          PY
          cat bundle.env >> "$GITHUB_ENV"

      - name: Pack the bundle
        run: npx -y @anthropic-ai/mcpb@2.1.2 pack . "$BUNDLE"

      # A package that installs but doesn't start is worse than no package
      # at all: the client accepts it, and only then does every tool call
      # fail. We unpack it and import the entry-point module through uv
      # exactly the way the host will — this proves that the pyproject.toml
      # inside the package resolves, the package installs, and
      # `mcpb/launch.py` reaches it despite the relative imports in
      # `server.py`.
      #
      # An import, not a full stdio handshake, deliberately: a server
      # without OJS_BASE_URL exits with a configuration error, so it would
      # never reach `initialize` anyway. Protocol behavior (initialize,
      # tools, resources, prompts) is covered by the full test suite in the
      # `tests` job above (workflow_call to tests.yml, required by
      # `needs: tests`) — this step doesn't repeat it. It checks
      # EXCLUSIVELY what `tests.yml` does NOT see: whether the PACKAGED
      # artifact (manifest, launch.py, the bundled pyproject.toml/uv.lock)
      # actually resolves and imports through `uv` the way the host will.
      - name: Check that the package imports
        run: |
          set -euo pipefail
          unzip -q "$BUNDLE" -d unpacked
          uv run --directory unpacked python -c "
          from ojs_mcp.server import main
          assert callable(main), 'entry point is not callable'
          print('package imports cleanly')
          "

      # Tag only. A manual run (workflow_dispatch) runs from a branch,
      # where `ref_name` is the branch name (e.g. 'main') — without this
      # condition, the step would create a release with that name. A
      # manual run is only meant to build the package and check it.
      #
      # TAG goes through env, not by interpolating `${{ }}` into a shell
      # line: a tag name is text supplied by whoever cut the release, and
      # bash would otherwise execute it.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$BUNDLE" --clobber
          else
            gh release create "$TAG" "$BUNDLE" --generate-notes --title "$TAG"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcpb-bundle
          path: ${{ env.BUNDLE }}
          if-no-files-found: error
