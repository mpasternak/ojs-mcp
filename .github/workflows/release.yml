name: release

# A release is triggered by pushing a `vX.Y.Z` tag. The version number is
# NOT taken from the tag — the tag must match `project.version` in
# pyproject.toml, otherwise the `build` job aborts. Reason: a version once
# published to PyPI is irreversible (`yank` hides a release, but does not
# free up the number).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The same matrix (3.10-3.13 + ruff) as on a regular push — nothing ships
  # to PyPI if the tests aren't green. `workflow_call` instead of copying
  # the steps.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Check the tag matches the version in pyproject.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (version ${tag}) does not match project.version in pyproject.toml (${ver}). Fix the version or the tag — a PyPI version number cannot be reclaimed."
            exit 1
          fi
          echo "Tag matches version ${ver}."

      - name: Build sdist and wheel
        run: uv build

      - name: Twine check (the README must render on PyPI)
        run: uvx twine check --strict dist/*

      # The endpoint index is a *.txt, not a *.py — exactly the class of
      # file packaging silently drops. Without it, the `ojs://endpoints`
      # resource only fails at runtime for the user, not here.
      - name: Sanity — data resource in the wheel
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          wheels = glob.glob("dist/*.whl")
          if len(wheels) != 1:
              sys.exit(f"Expected exactly one wheel in dist/, got: {wheels}")
          with zipfile.ZipFile(wheels[0]) as z:
              if "ojs_mcp/data/endpoints.compact.txt" not in z.namelist():
                  sys.exit("The wheel is missing ojs_mcp/data/endpoints.compact.txt")
          print(f"Data resource present in {wheels[0]}.")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # A separate job: `id-token: write` (an OIDC token exchanged for a
  # one-time publish permission) belongs EXCLUSIVELY to this step, which
  # runs no code from the repository or its dependencies at all — it
  # downloads a ready-made artifact and calls one pinned action. A
  # publishing job that runs arbitrary code is a path to hijacking the
  # package on PyPI — that is why `build` (which runs the project's code
  # and its dependencies) does not have this permission.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
