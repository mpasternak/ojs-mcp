name: release

# Wydanie wyzwala push tagu `vX.Y.Z`. Numer wersji NIE jest brany z tagu —
# tag musi się zgadzać z `project.version` w pyproject.toml, inaczej job
# `build` przerywa. Powód: wersja raz opublikowana na PyPI jest nieodwracalna
# (`yank` ukrywa wydanie, ale nie zwalnia numeru).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Ta sama matryca (3.10–3.13 + ruff) co przy zwykłym pushu — nic nie leci na
  # PyPI, jeśli testy nie są zielone. `workflow_call` zamiast kopiowania kroków.
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Zainstaluj uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"

      - name: Sprawdź zgodność tagu z wersją w pyproject.toml
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} (wersja ${tag}) nie zgadza się z project.version w pyproject.toml (${ver}). Popraw wersję albo tag — numeru na PyPI nie da się odzyskać."
            exit 1
          fi
          echo "Tag zgodny z wersją ${ver}."

      - name: Zbuduj sdist i wheel
        run: uv build

      - name: Twine check (README musi się renderować na PyPI)
        run: uvx twine check --strict dist/*

      # Indeks endpointów to *.txt, nie *.py — dokładnie ta klasa plików,
      # którą packaging gubi po cichu. Bez niego zasób `ojs://endpointy`
      # wywala się dopiero w runtime u użytkownika, nie tutaj.
      - name: Sanity — zasób danych w kole
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import zipfile

          kola = glob.glob("dist/*.whl")
          if len(kola) != 1:
              sys.exit(f"Oczekiwano dokładnie jednego koła w dist/, jest: {kola}")
          with zipfile.ZipFile(kola[0]) as z:
              if "ojs_mcp/data/endpoints.compact.txt" not in z.namelist():
                  sys.exit("W kole brakuje ojs_mcp/data/endpoints.compact.txt")
          print(f"Zasób danych obecny w {kola[0]}.")
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Osobny job: `id-token: write` (token OIDC wymieniany na jednorazowe
  # uprawnienie do publikacji) ma WYŁĄCZNIE ten krok, który nie wykonuje
  # żadnego kodu z repozytorium ani z zależności — pobiera gotowy artefakt
  # i woła jedną przypiętą akcję. Job publikujący, który uruchamia dowolny
  # kod, to droga do przejęcia pakietu na PyPI — dlatego `build` (który
  # wykonuje kod projektu i zależności) nie ma tego uprawnienia.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Opublikuj na PyPI (trusted publishing, OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
