site_name: ojs-mcp
site_description: MCP server for the authenticated Open Journal Systems REST API (OJS 3.5/3.6)
site_url: https://mpasternak.github.io/ojs-mcp/
repo_url: https://github.com/mpasternak/ojs-mcp
repo_name: mpasternak/ojs-mcp
edit_uri: edit/main/docs/

docs_dir: docs

# Project spec and plan — working material for agents, not user-facing
# documentation. The files stay in the repository but are excluded from
# the built site.
exclude_docs: |
  superpowers/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Authentication: authentication.md
  - Tools: tools.md
  - Hosting: hosting.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn
