[project]
name = "ojs-mcp"
version = "0.1.0"
description = "Serwer MCP dla uwierzytelnionego REST API Open Journal Systems (OJS 3.5/3.6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["ojs", "mcp", "open-journal-systems", "pkp", "api", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# Górna granica na `mcp` jest obowiązkowa: wydanie główne SDK potrafi skasować
# cały moduł serwera, a niezwiązany specyfikator wpuściłby to użytkownikom
# `uvx` przy zielonym repozytorium. Sufit podnosimy ręcznie, po porcie.
# `starlette` deklarowane jawnie, bo importujemy je wprost (walidacja Origin) —
# przychodzenie tranzytywne z `mcp` nie jest kontraktem.
# `uvicorn` deklarowane jawnie, bo późniejsze zadanie importuje je wprost do
# transportu HTTP — przychodzenie tranzytywne nie jest kontraktem.
dependencies = ["mcp>=2,<3", "httpx>=0.27", "starlette>=0.27", "uvicorn>=0.30"]

[project.urls]
Homepage = "https://github.com/mpasternak/ojs-mcp"
Repository = "https://github.com/mpasternak/ojs-mcp"

[project.scripts]
ojs-mcp = "ojs_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojs_mcp"]
artifacts = ["src/ojs_mcp/data/*.txt"]

[tool.hatch.build.targets.sdist]
include = ["src/ojs_mcp", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ojs_mcp", "conftest"]
