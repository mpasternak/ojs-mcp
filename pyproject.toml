[project]
name = "ojs-mcp"
version = "0.1.0"
description = "MCP server for the authenticated Open Journal Systems REST API (OJS 3.5/3.6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["ojs", "mcp", "open-journal-systems", "pkp", "api", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
# The upper bound on `mcp` is mandatory: a major SDK release can delete the
# entire server module outright, and an unbounded specifier would hand that
# to `uvx` users on a green repository. We raise the ceiling by hand, after
# porting.
# The lower bound `>=2.2` (review, group D): we only ever tested 2.2.0 — the
# previously declared floor `>=2` was UNVERIFIED, and could have silently
# let in an earlier, untested 2.x release.
# `starlette` is declared explicitly because we import it directly (Origin
# validation) — arriving transitively via `mcp` is not a contract.
# `uvicorn` is declared explicitly because a later task imports it directly
# for the HTTP transport — arriving transitively is not a contract.
# `anyio` is declared explicitly because `server.main()` calls `anyio.run()`
# directly, so the stdio server and closing the httpx client run in one
# event loop — arriving transitively via `mcp` is not a contract.
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "starlette>=0.27",
    "uvicorn>=0.30",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/mpasternak/ojs-mcp"
Repository = "https://github.com/mpasternak/ojs-mcp"
Documentation = "https://mpasternak.github.io/ojs-mcp/"
Issues = "https://github.com/mpasternak/ojs-mcp/issues"
Changelog = "https://github.com/mpasternak/ojs-mcp/blob/main/CHANGELOG.md"

[project.scripts]
ojs-mcp = "ojs_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojs_mcp"]
artifacts = ["src/ojs_mcp/data/*.txt"]

[tool.hatch.build.targets.sdist]
include = ["src/ojs_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Documents under docs/ are narrative, not source code. Since 0.16, ruff
# formats Python blocks embedded in Markdown, which made the spec and the
# implementation plan fail `ruff format --check .` — red CI because a
# design document wrote a tuple on one line, carrying no information about
# code quality.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ojs_mcp", "conftest"]
