[project]
name = "ojs-mcp"
version = "0.1.0"
description = "MCP server for the authenticated Open Journal Systems REST API (OJS 3.5/3.6)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michał Pasternak", email = "michal.dtz@gmail.com" }]
keywords = ["ojs", "mcp", "open-journal-systems", "pkp", "api", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
# Górna granica na `mcp` jest obowiązkowa: wydanie główne SDK potrafi skasować
# cały moduł serwera, a niezwiązany specyfikator wpuściłby to użytkownikom
# `uvx` przy zielonym repozytorium. Sufit podnosimy ręcznie, po porcie.
# Dolna granica `>=2.2` (recenzja, grupa D): testowaliśmy wyłącznie 2.2.0 —
# deklarowana wcześniej podłoga `>=2` była NIESPRAWDZONA, mogła cicho
# wpuścić wcześniejsze, nietestowane wydanie 2.x.
# `starlette` deklarowane jawnie, bo importujemy je wprost (walidacja Origin) —
# przychodzenie tranzytywne z `mcp` nie jest kontraktem.
# `uvicorn` deklarowane jawnie, bo późniejsze zadanie importuje je wprost do
# transportu HTTP — przychodzenie tranzytywne nie jest kontraktem.
# `anyio` deklarowane jawnie, bo `server.main()` woła `anyio.run()` wprost,
# żeby serwer stdio i zamknięcie klienta httpx działały w jednej pętli
# zdarzeń — przychodzenie tranzytywne z `mcp` nie jest kontraktem.
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
    "starlette>=0.27",
    "uvicorn>=0.30",
    "anyio>=4.0",
]

[project.urls]
Homepage = "https://github.com/mpasternak/ojs-mcp"
Repository = "https://github.com/mpasternak/ojs-mcp"
Documentation = "https://mpasternak.github.io/ojs-mcp/"
Issues = "https://github.com/mpasternak/ojs-mcp/issues"
Changelog = "https://github.com/mpasternak/ojs-mcp/blob/main/CHANGELOG.md"

[project.scripts]
ojs-mcp = "ojs_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff>=0.6"]
docs = ["mkdocs-material>=9.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojs_mcp"]
artifacts = ["src/ojs_mcp/data/*.txt"]

[tool.hatch.build.targets.sdist]
include = ["src/ojs_mcp", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
# Dokumenty w docs/ to narracja, nie kod źródłowy. Ruff od 0.16 formatuje
# bloki Pythona wewnątrz Markdowna, przez co spec i plan implementacji
# wywalały `ruff format --check .` — czerwone CI dlatego, że dokument
# projektowy zapisał krotkę w jednej linii, nie niesie żadnej informacji
# o jakości kodu.
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ojs_mcp", "conftest"]
